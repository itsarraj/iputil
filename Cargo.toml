[package]
name = "iputil"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust CIDR/subnet calculator — network/broadcast/host-range and subnet splitting, no ipcalc binary required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/iputil"
readme = "README.md"
keywords = ["cidr", "subnet", "ipcalc", "networking", "cli"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "iputil"
path = "src/lib.rs"

[[bin]]
name = "iputil"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
